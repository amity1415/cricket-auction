<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cricket Auction — Final Squads</title>
  <style>
    :root {
      --ink: #f4f8ff; --muted: #b9c6ea; --dim: #8ea0c9;
      --navy: #070b1c; --navy2: #0e1636; --panel: #121c40;
      --gold: #ffcb5e; --gold2: #ffb43d;
      --cyan: #35d6e6; --violet: #a06bff; --green: #46eaa8;
      --line: rgba(150,176,240,.16);
      --accent: #5b8cff;            /* recoloured per team card */
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(120% 90% at 50% -10%, #16224e 0%, transparent 55%),
        linear-gradient(180deg, #0a1130, #05070f 70%);
      background-attachment: fixed;
    }

    /* ---------------- Top control bar (never part of a screenshot) ---------- */
    .sc-bar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 12px clamp(14px, 3vw, 28px);
      background: linear-gradient(180deg, rgba(8,12,28,.92), rgba(8,12,28,.62));
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .sc-bar h1 { font-size: clamp(15px, 2vw, 19px); margin: 0; font-weight: 800; letter-spacing: .01em; }
    .sc-bar .sub { color: var(--dim); font-size: 12.5px; font-weight: 600; }
    .sc-bar .spacer { flex: 1 1 auto; }
    .sc-jump { display: flex; gap: 6px; flex-wrap: wrap; }
    .sc-jump button {
      font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
      color: var(--muted); background: rgba(255,255,255,.05);
      border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px;
      transition: all .15s ease;
    }
    .sc-jump button:hover { color: #fff; background: rgba(91,140,255,.22); border-color: rgba(91,140,255,.5); }
    .sc-admin { display: flex; align-items: center; gap: 10px; }
    .sc-admin .pill {
      font-size: 11.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px;
    }
    .pill.live { color: #04140c; background: linear-gradient(100deg, #7dffbe, #00e07a); }
    .pill.draft { color: #241a05; background: linear-gradient(100deg, var(--gold), var(--gold2)); }
    .btn {
      font: inherit; font-weight: 800; font-size: 13px; cursor: pointer; white-space: nowrap;
      border-radius: 10px; padding: 8px 15px; border: 1px solid transparent; transition: all .15s ease;
    }
    .btn.primary { color: #04140c; background: linear-gradient(100deg, #7dffbe, #00e07a); }
    .btn.primary:hover { filter: brightness(1.07); }
    .btn.ghost { color: var(--muted); background: rgba(255,255,255,.05); border-color: var(--line); }
    .btn.ghost:hover { color: #fff; border-color: rgba(255,255,255,.3); }
    .btn:disabled { opacity: .5; cursor: default; }

    /* ---------------- Empty / coming-soon state ---------------------------- */
    .sc-hero {
      min-height: 72vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 40px 24px; gap: 14px;
    }
    .sc-hero .trophy { font-size: 64px; filter: drop-shadow(0 8px 20px rgba(255,180,60,.35)); }
    .sc-hero h2 { font-size: clamp(22px, 3.4vw, 34px); margin: 0; font-weight: 900; letter-spacing: -.01em; }
    .sc-hero p { color: var(--muted); max-width: 460px; font-size: 15px; line-height: 1.5; margin: 0; }

    /* ---------------- Gallery of team cards -------------------------------- */
    #sc-stage { padding: clamp(16px, 3vw, 34px) 14px 64px; display: flex; flex-direction: column; align-items: center; gap: 40px; }

    /* One team = one Instagram-portrait (4:5) card. */
    .team-card {
      position: relative; width: min(880px, 96vw); min-height: min(1100px, 120vw);
      border-radius: 26px; overflow: hidden; scroll-margin-top: 78px;
      color: var(--ink);
      background:
        radial-gradient(120% 70% at 50% -8%, color-mix(in srgb, var(--accent) 42%, transparent), transparent 60%),
        linear-gradient(180deg, var(--navy2), var(--navy));
      border: 1px solid rgba(150,176,240,.22);
      box-shadow: 0 30px 70px -30px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.06);
      display: flex; flex-direction: column;
    }
    /* team accent side rail + corner glow */
    .team-card::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(60% 40% at 108% 0%, color-mix(in srgb, var(--accent) 34%, transparent), transparent 60%);
    }
    .tc-head {
      display: flex; align-items: center; gap: 14px;
      padding: clamp(16px, 3.4%, 22px) clamp(18px, 4%, 26px) 12px;
    }
    .tc-crest { width: clamp(52px, 13%, 74px); height: clamp(52px, 13%, 74px); flex: none;
      display: flex; align-items: center; justify-content: center; }
    .tc-crest img { width: 100%; height: 100%; object-fit: contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.55)); }
    .tc-crest .crest {
      width: 100%; height: 100%; border-radius: 16px; display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 24px; color: #fff;
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 40%, #10152e));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
    }
    .tc-titles { min-width: 0; }
    .tc-kicker { font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
    .tc-name { font-size: clamp(22px, 5.4%, 30px); font-weight: 900; letter-spacing: -.01em; line-height: 1.04;
      text-shadow: 0 2px 10px rgba(0,0,0,.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tc-count { font-size: 12px; color: var(--dim); font-weight: 600; margin-top: 2px; }

    .tc-body { flex: 1 1 auto; overflow: visible; padding: 6px clamp(18px, 3.5%, 30px) 10px;
      display: flex; flex-direction: column; gap: 12px; }

    /* Featured OWNER / ICON row (wraps to 2-per-row when there are 3+ so names fit) */
    .tc-featured { display: flex; gap: 10px; flex-wrap: wrap; }
    .feat {
      flex: 1 1 calc(50% - 6px); min-width: 0; display: flex; align-items: center; gap: 14px;
      padding: 12px 15px; border-radius: 16px;
      background: linear-gradient(120deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
      border: 1px solid var(--line);
    }
    .feat .ava { width: 74px; height: 74px; flex: none; }
    .feat .ava .ini { font-size: 24px; }
    .feat .who { min-width: 0; }
    .feat .badge {
      display: inline-block; font-size: 11px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase;
      padding: 3px 10px; border-radius: 999px; margin-bottom: 5px;
    }
    .badge.owner { color: #241a05; background: linear-gradient(100deg, var(--gold), var(--gold2));
      box-shadow: 0 2px 8px -2px rgba(255,180,60,.6); }
    .badge.icon { color: #04121a; background: linear-gradient(100deg, #8be9f5, var(--cyan));
      box-shadow: 0 2px 8px -2px rgba(53,214,230,.6); }
    .feat .nm { font-weight: 800; font-size: 17px; line-height: 1.14; overflow-wrap: anywhere; }
    .feat.owner { border-color: rgba(255,203,94,.4); }
    .feat.icon  { border-color: rgba(53,214,230,.4); }

    .tc-squad-label { font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
      color: var(--dim); margin: 2px 2px -2px; }
    /* squad grid — players by name + photo only (no category). Auto-fills as many
       comfortable columns as the (now wide) card allows, so avatars stay large and
       every name has room; the card grows taller for big squads instead of shrinking. */
    .tc-grid { flex: 0 0 auto; overflow: visible;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px 10px; align-content: start; }
    .plr { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
    .plr .nm { font-size: 14px; font-weight: 700; text-align: center; line-height: 1.18;
      color: #eaf0ff; max-width: 100%; overflow-wrap: anywhere;
      text-shadow: 0 1px 4px rgba(0,0,0,.6); }

    /* Avatar (photo with initials fallback) */
    .ava { position: relative; border-radius: 50%; overflow: hidden; flex: none;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 60%, #10152e), #0c1230);
      box-shadow: 0 4px 12px -3px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.14);
      display: flex; align-items: center; justify-content: center; }
    .plr .ava { width: clamp(84px, 12vw, 108px); height: clamp(84px, 12vw, 108px); aspect-ratio: 1; }
    .ava img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
    .ava .ini { font-weight: 800; color: #dfe7fb; font-size: 20px; letter-spacing: .02em; }
    .ava.ring-gold { box-shadow: 0 4px 12px -3px rgba(0,0,0,.6), 0 0 0 2px var(--gold), 0 0 14px -2px rgba(255,180,60,.7); }
    .ava.ring-cyan { box-shadow: 0 4px 12px -3px rgba(0,0,0,.6), 0 0 0 2px var(--cyan), 0 0 14px -2px rgba(53,214,230,.7); }

    .tc-foot {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 9px clamp(18px, 4%, 26px) clamp(13px, 3%, 18px);
      border-top: 1px solid var(--line);
    }
    .tc-foot .brand { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .tc-foot .brand img { height: 17px; width: auto; opacity: .95; }
    .tc-foot .event { font-size: 11px; font-weight: 800; letter-spacing: .04em; color: var(--gold); text-align: right;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Card action buttons — Save PNG + Focus (hidden in focus + print + export) */
    .tc-shot, .tc-save {
      position: absolute; top: 10px; z-index: 5;
      font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; color: #fff;
      border: 1px solid var(--line); border-radius: 9px; padding: 5px 9px;
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); opacity: 0; transition: opacity .15s ease;
    }
    .tc-shot { right: 10px; background: rgba(8,12,28,.6); }
    .tc-save { right: 92px; color: #04140c; border-color: transparent;
      background: linear-gradient(100deg, #7dffbe, #00e07a); }
    .tc-save:disabled { opacity: .6 !important; cursor: default; }
    .team-card:hover .tc-shot, .team-card:hover .tc-save { opacity: 1; }
    @media (hover: none) { .tc-shot, .tc-save { opacity: 1; } }   /* always visible on touch */

    /* ---------------- Focus / lightbox (a clean single card to screenshot) -- */
    #sc-focus {
      position: fixed; inset: 0; z-index: 100; display: none;
      align-items: flex-start; justify-content: center; padding: 18px 64px; overflow: auto;
      background: radial-gradient(80% 80% at 50% 40%, #0a1130, #04060d 80%);
    }
    #sc-focus.on { display: flex; }
    #sc-focus .tc-shot, #sc-focus .tc-save { display: none; }
    #sc-focus .stagewrap { position: relative; display: flex; align-items: flex-start; justify-content: center;
      min-height: 100%; width: 100%; }
    #sc-focus .team-card { width: min(900px, 100%); min-height: 0; margin: auto; }
    .focus-btn {
      position: fixed; z-index: 101; top: 50%; transform: translateY(-50%);
      width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
      background: rgba(255,255,255,.08); border: 1px solid var(--line); color: #fff; font-size: 20px;
      display: flex; align-items: center; justify-content: center; transition: all .15s ease;
    }
    .focus-btn:hover { background: rgba(91,140,255,.3); }
    #sc-prev { left: 14px; } #sc-next { right: 14px; }
    #sc-close { position: fixed; top: 14px; right: 16px; z-index: 101; }
    .focus-hint { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 101;
      color: var(--dim); font-size: 12px; font-weight: 600; background: rgba(8,12,28,.6);
      padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); }

    @media (max-width: 420px) {
      .tc-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* Print: one clean card per page, no chrome. */
    @media print {
      .sc-bar, .tc-shot, .tc-save, #sc-focus, .focus-btn, .focus-hint { display: none !important; }
      body { background: #05070f; }
      #sc-stage { gap: 0; padding: 0; }
      .team-card { width: 100%; max-width: 720px; box-shadow: none; break-after: page; page-break-after: always; }
    }
  </style>
</head>
<body>
  <div class="sc-bar" id="sc-bar">
    <div>
      <h1 id="sc-title">Final Squads</h1>
      <div class="sub" id="sc-sub">Loading…</div>
    </div>
    <div class="sc-jump" id="sc-jump"></div>
    <div class="spacer"></div>
    <a class="btn ghost" id="sc-csv" href="/api/dashboard/players-export.csv" download
       title="Download every player with all data, team and price (CSV / Excel)">⬇ Players data (CSV)</a>
    <div class="sc-admin" id="sc-admin" style="display:none">
      <span class="pill" id="sc-status"></span>
      <button class="btn primary" id="sc-publish">Publish showcase</button>
    </div>
  </div>

  <div id="sc-content"></div>

  <!-- Focus lightbox -->
  <div id="sc-focus" aria-hidden="true">
    <button class="focus-btn" id="sc-prev" title="Previous team">‹</button>
    <div class="stagewrap" id="sc-focus-stage"></div>
    <button class="focus-btn" id="sc-next" title="Next team">›</button>
    <button class="btn primary focus-save" id="sc-focus-save" style="position:fixed;top:14px;left:16px;z-index:101;width:auto;height:auto;border-radius:10px;padding:8px 14px">⬇ Save PNG</button>
    <button class="btn ghost focus-btn-close" id="sc-close" style="width:auto;height:auto;border-radius:10px;padding:8px 14px">✕ Close</button>
    <div class="focus-hint">Save this card as an image (or screenshot it) • use ‹ › to switch teams • Esc to close</div>
  </div>

  <script src="team-logo.js?v=2"></script>
  <script src="card-export.js?v=1"></script>
  <script src="showcase.js?v=4"></script>
</body>
</html>
