<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cricket Auction — Ticker</title>
  <!-- Bottom-of-screen auction ticker: a broadcast-grade lower-third overlay
       meant to be dropped in as an OBS / vMix "browser source" over a live video
       feed. The panel is deliberately ~70% see-through so the video is never
       hidden; legibility comes from local scrims + text-shadows + bright labels
       (NOT backdrop-blur, which can't see OBS's video layer). Open it scoped to
       an auction: ticker.html?tournamentId=<id>. Fully hidden until a player is
       on the block. Self-contained — its own CSS/animation, no external assets. -->
  <style>
    :root {
      --tk-ink: #f4f8ff; --tk-label: #eaf0ff; --tk-muted: #c4d0ee;
      --tk-green: #46eaa8; --tk-amber: #ffcb5e; --tk-red: #ff6a5e;
      --tk-accent: #5b8cff; --tk-accent-2: #a06bff; --tk-cyan: #35d6e6;
      /* Tinted translucent panel — a mid-tone indigo/violet that reads against
         BOTH light and dark video (dark enough to sit on white, saturated and
         light enough to stand off black), kept see-through for the feed. */
      --tk-glass: rgba(48, 40, 120, 0.46);
      --tk-glass-top: rgba(78, 60, 168, 0.42);
      --tk-glass-2: rgba(26, 20, 66, 0.68);      /* denser scrim behind figures/tiles */
      --tk-line: rgba(170, 186, 245, 0.32);
      --tk-shadow: 0 3px 14px rgba(0,0,0,0.85);
      --tk-tshadow: 0 2px 8px rgba(0,0,0,0.92), 0 0 2px rgba(0,0,0,0.95);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: transparent;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      color: var(--tk-ink); overflow: hidden;
    }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

    /* ============================ Root band ============================ */
    #tk-root {
      position: fixed; left: 50%; bottom: clamp(12px, 3vh, 32px);
      transform: translateX(-50%);
      width: min(960px, 88vw);
      opacity: 0; visibility: hidden; transition: opacity .4s ease;
      pointer-events: none; --team: var(--tk-accent);   /* recoloured per leading team */
    }
    #tk-root.show { opacity: 1; visibility: visible; }
    #tk-root.enter { animation: tk-rise .5s cubic-bezier(.16,.84,.28,1) both; }
    @keyframes tk-rise { from { transform: translateX(-50%) translateY(38px); opacity: 0; }
                         to   { transform: translateX(-50%) translateY(0);    opacity: 1; } }

    /* Floating status pill above the bar. */
    .tk-live {
      position: absolute; left: clamp(10px, 3vw, 30px); top: -12px; z-index: 7;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 11px 3px 9px; border-radius: 20px;
      background: linear-gradient(100deg, rgba(255,58,58,.94), rgba(180,20,40,.94));
      font-size: clamp(8px, .82vw, 10px); font-weight: 800; letter-spacing: .16em;
      text-transform: uppercase; box-shadow: 0 6px 16px -6px rgba(255,40,60,.8), var(--tk-shadow);
      transition: background .3s ease;
    }
    .tk-live.sold  { background: linear-gradient(100deg, rgba(45,200,140,.95), rgba(20,140,95,.95));
      box-shadow: 0 6px 16px -6px rgba(45,200,140,.8), var(--tk-shadow); }
    .tk-live.unsold { background: linear-gradient(100deg, rgba(120,130,150,.9), rgba(70,80,100,.92));
      box-shadow: var(--tk-shadow); }
    .tk-live-dot { width: 7px; height: 7px; border-radius: 50%; background: #fff;
      box-shadow: 0 0 0 0 rgba(255,255,255,.9); animation: tk-ping 1.6s ease-out infinite; }
    @keyframes tk-ping {
      0% { box-shadow: 0 0 0 0 rgba(255,255,255,.85); }
      70%,100% { box-shadow: 0 0 0 8px rgba(255,255,255,0); }
    }

    /* Portrait pops ABOVE the centre column (floats in the root so the bar's
       clip/overflow never touches it). Kept small so the band stays compact. */
    .tk-portrait-wrap {
      position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, 6%);
      width: clamp(112px, 12.8vw, 168px); z-index: 4; text-align: center;   /* ~2x larger photo, pulled up */
    }
    .tk-portrait {
      position: relative; width: 100%; aspect-ratio: 1; border-radius: 50%;
      overflow: hidden; margin: 0 auto;
      background: linear-gradient(135deg, var(--tk-accent), var(--tk-accent-2));
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: clamp(38px, 5vw, 66px);
      box-shadow: 0 16px 40px -12px rgba(0,0,0,.82),
                  0 0 0 3px rgba(8,12,26,.85), 0 0 0 5px color-mix(in srgb, var(--team) 70%, transparent);
    }
    .tk-portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* Rotating conic glow ring behind the portrait — the "dynamic background".
       Sized tight so it doesn't wash over the player name below. */
    .tk-portrait-wrap::before {
      content: ""; position: absolute; left: 50%; top: 50%;
      width: 123%; height: 123%; transform: translate(-50%, -50%); z-index: -2;   /* half-width glow ring */
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--tk-accent), var(--tk-cyan),
                  var(--tk-green), var(--tk-amber), var(--tk-accent-2), var(--tk-accent));
      filter: blur(9px); opacity: .9; animation: tk-spin 7s linear infinite;
    }
    .tk-portrait-wrap::after {
      content: ""; position: absolute; left: 50%; top: 50%;
      width: 111%; height: 111%; transform: translate(-50%, -50%); z-index: -1;
      border-radius: 50%; border: 1px solid color-mix(in srgb, var(--team) 60%, transparent);
      animation: tk-halo 2.6s ease-out infinite;
    }
    @keyframes tk-spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    @keyframes tk-halo {
      0% { opacity: .8; width: 102%; height: 102%; }
      100% { opacity: 0; width: 128%; height: 128%; }
    }
    /* Orbiting sparks — tucked to hug the smaller glow ring (inset pulls the
       orbit radius in so the dots ride the rim rather than floating wide). */
    .tk-orbit { position: absolute; inset: 8%; z-index: -1; animation: tk-spin 9s linear infinite; }
    .tk-orbit.b { animation-duration: 6s; animation-direction: reverse; }
    .tk-orbit i { position: absolute; top: -2px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px;
      border-radius: 50%; background: #fff; box-shadow: 0 0 8px 2px var(--tk-cyan); }
    .tk-orbit.b i { background: var(--tk-amber); box-shadow: 0 0 8px 2px var(--tk-amber); }

    /* Name sits ABOVE the portrait glow (higher stacking) and a touch lower so
       the animation never hides it. */
    .tk-name {
      margin-top: 0; font-weight: 800; letter-spacing: .01em;
      font-size: clamp(12px, 1.35vw, 17px); line-height: 1.08;
      text-shadow: 0 2px 12px rgba(0,0,0,.92), 0 0 3px rgba(0,0,0,.95);
    }
    .tk-meta { display: flex; align-items: center; justify-content: center; gap: 6px;
      flex-wrap: wrap; margin-top: 1px; }
    .tk-role { font-size: clamp(8.5px, .9vw, 11px); color: var(--tk-muted);
      font-weight: 700; text-shadow: var(--tk-tshadow); }
    /* Player group (A/B/C/D/E/ICON/OWNER…) — a gold pill next to the role. */
    .tk-grp {
      font-size: clamp(7.5px, .78vw, 10px); font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
      color: #17110a; padding: 1px 8px; border-radius: 20px; white-space: nowrap;
      background: linear-gradient(100deg, #ffd76a, #ffb43d);
      box-shadow: 0 2px 8px -3px rgba(255,180,60,.7);
    }
    /* Lot / serial number — a badge at the BOTTOM of the photo (same style as
       it sat at the top). */
    .tk-serial {
      position: absolute; bottom: -7px; top: auto; left: 50%; transform: translateX(-50%); z-index: 5;
      font-size: clamp(9px, 1vw, 12.5px); font-weight: 900; color: #fff; line-height: 1; white-space: nowrap;
      padding: 3px 10px; border-radius: 20px;
      background: linear-gradient(135deg, var(--tk-accent), var(--tk-accent-2));
      box-shadow: 0 4px 12px -3px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.28);
      text-shadow: 0 1px 3px rgba(0,0,0,.6);
    }

    /* ============================ The glass bar ============================ */
    .tk-bar {
      position: relative; display: grid; align-items: center;
      grid-template-columns: 1fr minmax(150px, 206px) 1.08fr;
      gap: clamp(7px, 1.1vw, 15px);
      padding: clamp(2px, .35vh, 4px) clamp(16px, 1.9vw, 24px);
      padding-top: clamp(2px, .4vh, 5px);             /* shorter upper band */
      border-radius: 16px;
      background:
        radial-gradient(120% 150% at 50% -40%, color-mix(in srgb, var(--team) 26%, transparent), transparent 60%),
        linear-gradient(180deg, var(--tk-glass-top), var(--tk-glass));
      border: 1px solid rgba(150,176,240,.22);
      box-shadow: 0 22px 60px -22px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.06);
      -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 13px), calc(100% - 13px) 100%, 13px 100%, 0 calc(100% - 13px));
      overflow: hidden;
    }
    .tk-bar::before {
      content: ""; position: absolute; left: 0; top: 10%; bottom: 10%; width: 4px; border-radius: 4px;
      background: linear-gradient(180deg, var(--tk-accent), color-mix(in srgb, var(--team) 90%, #fff 0%), var(--tk-accent-2));
      box-shadow: 0 0 12px 1px color-mix(in srgb, var(--team) 70%, transparent);
    }
    .tk-bar::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(105deg, transparent 34%, rgba(255,255,255,.09) 48%, transparent 60%);
      transform: translateX(-60%); animation: tk-sheen 6s ease-in-out infinite;
    }
    @keyframes tk-sheen { 0%,52% { transform: translateX(-62%); } 100% { transform: translateX(165%); } }

    .tk-topline {
      position: absolute; left: 8px; right: 8px; top: 0; height: 2px; z-index: 2; border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--tk-accent), var(--tk-cyan), var(--tk-amber), transparent);
      background-size: 220% 100%; animation: tk-flow 5s linear infinite; opacity: .85;
    }
    .tk-scan {
      position: absolute; left: 12%; bottom: 4px; height: 2px; width: 24%; z-index: 2; border-radius: 2px;
      background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--team) 90%, #fff), transparent);
      animation: tk-scanmove 4.5s ease-in-out infinite; opacity: .75;
    }
    @keyframes tk-flow { to { background-position: 220% 0; } }
    @keyframes tk-scanmove { 0%{left:8%} 50%{left:66%} 100%{left:8%} }

    .tk-cell { position: relative; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
    .tk-cell.left  { align-items: flex-start; }
    /* Name/role sit at the bottom-centre of the upper band (centre-low), right
       under the large photo. Stretch the cell to the row height so flex-end
       drops the name to the base. */
    .tk-cell.center { align-self: stretch; justify-content: flex-end; align-items: center;
      text-align: center; gap: 1px; z-index: 6; padding-bottom: 0;
      transform: translateY(clamp(4px, 1vh, 8px)); }   /* name/role dropped lower */
    .tk-cell.right { align-items: stretch; }
    .tk-cell.center::before, .tk-cell.center::after {
      content: ""; position: absolute; top: -2px; bottom: -2px; width: 1px;
      background: linear-gradient(180deg, transparent, var(--tk-line), transparent);
      transform: skewX(-12deg);
    }
    .tk-cell.center::before { left: calc(-1 * clamp(3px, .6vw, 8px)); }
    .tk-cell.center::after  { right: calc(-1 * clamp(3px, .6vw, 8px)); }

    /* Labels made brighter with a firm shadow so they read on light video. */
    .tk-label {
      font-size: clamp(8px, .76vw, 10px); letter-spacing: .15em; text-transform: uppercase;
      color: var(--tk-label); font-weight: 800; text-shadow: var(--tk-tshadow);
    }
    .tk-amount {
      font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; line-height: 1.05;
      text-shadow: 0 2px 10px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.95);
    }
    /* Local scrim chip behind money figures — kept fairly opaque for legibility. */
    /* Base Price and Current Bid: identical two-line blocks (label row, then
       amount row) at matching size, base on the left, current on the right. */
    .tk-base, .tk-current {
      padding: 2px 9px; border-radius: 8px;
      background: linear-gradient(180deg, rgba(255,255,255,.05), var(--tk-glass-2));
      box-shadow: inset 0 0 0 1px rgba(150,176,240,.16);
    }
    .tk-base { align-self: flex-start; display: flex; flex-direction: column; }
    .tk-base .tk-amount { font-size: clamp(15px, 1.9vw, 24px); color: #fff; }

    /* Right cell now holds the current-bid block + the leading-team display. */
    .tk-cell.right { flex-direction: row; align-items: center; gap: clamp(8px, 1.4vw, 18px); }
    .tk-current { min-width: 0; flex: none; }
    .tk-cur-row { display: flex; align-items: baseline; gap: 4px; }
    .tk-current .tk-amount { font-size: clamp(15px, 1.9vw, 24px); color: var(--tk-green);
      text-shadow: 0 2px 12px rgba(0,0,0,.9), 0 0 16px color-mix(in srgb, var(--tk-green) 45%, transparent); }

    /* Leading team — bigger name + logo, pushed to the far right (old Next Bid). */
    .tk-team { margin-left: auto; display: flex; align-items: center; gap: clamp(7px, 1vw, 12px); min-width: 0; }
    .tk-team-name {
      font-size: clamp(14px, 1.9vw, 24px); font-weight: 800; color: #fff;
      text-shadow: var(--tk-tshadow); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: clamp(120px, 24vw, 340px); text-align: right;
    }
    .tk-team-logo { flex: none; display: inline-flex; }
    .tk-team-logo .tk-crest { width: clamp(30px, 3.4vw, 46px); height: clamp(30px, 3.4vw, 46px);
      border-radius: 10px; }
    .tk-team-logo .tk-crest.initials { font-size: clamp(13px, 1.5vw, 19px); border-radius: 10px; }
    .tk-trend { color: var(--tk-green); font-size: .5em; opacity: 0; transform: translateY(4px); }
    .tk-current.bumped .tk-amount { animation: tk-pop .5s cubic-bezier(.2,.9,.3,1.4); }
    .tk-current.bumped .tk-trend { animation: tk-trend .9s ease-out; }
    @keyframes tk-pop { 0%{transform:scale(1)} 35%{transform:scale(1.13)} 100%{transform:scale(1)} }
    @keyframes tk-trend { 0%{opacity:0;transform:translateY(6px)} 30%{opacity:1;transform:translateY(-1px)} 100%{opacity:0;transform:translateY(-8px)} }
    .tk-leader {
      display: inline-flex; align-items: center; gap: 5px; margin-top: 0;
      font-weight: 700; font-size: clamp(9.5px, .9vw, 12px); min-width: 0; color: #fff;
      text-shadow: var(--tk-tshadow);
    }
    .tk-leader .tk-lname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tk-crest {
      width: clamp(20px, 2.1vw, 27px); height: clamp(20px, 2.1vw, 27px);
      border-radius: 6px; object-fit: contain; flex: none; background: rgba(255,255,255,.10);
      box-shadow: 0 0 0 1px rgba(255,255,255,.12);
    }
    .tk-crest.initials {
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; color: #fff;
      background: linear-gradient(135deg, var(--tk-accent), var(--tk-accent-2));
    }
    .tk-next {
      margin-left: auto; text-align: right; display: flex; flex-direction: column; align-items: flex-end;
    }
    .tk-next .tk-amount { font-size: clamp(12px, 1.4vw, 17px); color: var(--tk-amber);
      display: inline-flex; align-items: center; gap: 4px; }
    .tk-next .tk-amount::before { content: "▲"; font-size: .6em; color: var(--tk-amber); opacity: .9;
      animation: tk-bob 1.8s ease-in-out infinite; }
    @keyframes tk-bob { 0%,100%{transform:translateY(1px)} 50%{transform:translateY(-2px)} }

    /* ===================== Career stats — batting / bowling ===================== */
    /* Same two-panel format as the live broadcast board: a blue Batting panel and
       a red Bowling panel, each a header + a 5-tile row (value over label). */
    .tk-stats {
      grid-column: 1 / -1; margin-top: clamp(5px, .8vh, 9px);
      padding-top: clamp(5px, .8vh, 8px); border-top: 1px solid rgba(150,176,240,.16);
      display: flex; align-items: stretch; gap: clamp(6px, 1vw, 12px);
      max-height: 40vh; overflow: hidden;
      transition: max-height .45s ease, opacity .3s ease, margin-top .45s ease,
                  padding-top .45s ease, border-color .3s ease;
    }
    .tk-stats:empty { display: none; }
    /* Auto-cycle: when collapsed, the stats fold away and — because the band is
       anchored at the bottom — the whole upper ticker slides DOWN; restoring
       them slides it back UP. */
    #tk-root.stats-collapsed .tk-stats {
      max-height: 0; opacity: 0; margin-top: 0; padding-top: 0; border-top-color: transparent;
    }
    .stat-panels { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(6px, 1vw, 10px); flex: 1; min-width: 0; }
    .stat-panel { border: 1px solid var(--tk-line); border-radius: 9px; overflow: hidden;
      background: rgba(6,10,22,.42); }
    .stat-panel.batting { border-color: rgba(91,140,255,.5); }
    .stat-panel.bowling { border-color: rgba(240,86,74,.5); }
    .sp-head {
      display: flex; align-items: center; gap: 6px; padding: 3px 9px;
      font-size: clamp(8px, .82vw, 10.5px); font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    }
    .stat-panel.batting .sp-head { color: #dbe7ff; background: linear-gradient(90deg, rgba(91,140,255,.34), rgba(91,140,255,.05)); }
    .stat-panel.bowling .sp-head { color: #ffdccf; background: linear-gradient(90deg, rgba(240,86,74,.30), rgba(240,86,74,.05)); }
    .sp-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: rgba(150,176,240,.20); }
    .sp-grid .btile { background: var(--tk-glass-2); padding: 4px 3px; text-align: center; }
    .sp-grid .btile b { display: block; font-size: clamp(11px, 1.4vw, 16px); font-weight: 800; color: #fff;
      font-variant-numeric: tabular-nums; line-height: 1.05; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
    .sp-grid .btile span { font-size: clamp(7px, .72vw, 9px); color: #c9d3ec; text-transform: uppercase; letter-spacing: .03em; }
    .tk-bidcount {
      align-self: center; flex: none; color: var(--tk-amber); font-weight: 800; letter-spacing: .05em;
      font-size: clamp(9px, .95vw, 12px); padding: 4px 11px; border-radius: 20px;
      background: rgba(255,203,94,.16); box-shadow: inset 0 0 0 1px rgba(255,203,94,.4);
      text-shadow: var(--tk-tshadow);
    }

    /* ===================== SOLD / UNSOLD verdict ===================== */
    .tk-bar.sold   { border-color: rgba(70,234,168,.6); }
    .tk-bar.unsold { border-color: rgba(255,106,94,.55); }
    .tk-verdict { grid-column: 1 / -1; display: none; align-items: center; gap: clamp(10px, 1.6vw, 20px); }
    #tk-root.is-sold .tk-bidrow, #tk-root.is-sold .tk-base, #tk-root.is-sold .tk-stats { display: none; }
    #tk-root.is-sold .tk-verdict { display: flex; }
    .tk-stamp {
      font-weight: 900; letter-spacing: .14em; padding: 4px 16px; border-radius: 11px;
      border: 2px solid var(--tk-green); color: var(--tk-green);
      font-size: clamp(15px, 1.8vw, 25px); text-shadow: 0 0 16px rgba(70,234,168,.6);
      box-shadow: 0 0 22px -6px rgba(70,234,168,.7), inset 0 0 16px -8px rgba(70,234,168,.5);
      animation: tk-stamp-in .5s cubic-bezier(.2,.9,.3,1.5) both;
    }
    @keyframes tk-stamp-in { 0%{transform:rotate(-6deg) scale(0);opacity:0} 100%{transform:rotate(-4deg) scale(1);opacity:1} }
    .tk-bar.unsold .tk-stamp { border-color: var(--tk-red); color: var(--tk-red);
      text-shadow: 0 0 16px rgba(255,106,94,.5); box-shadow: 0 0 22px -6px rgba(255,106,94,.6); }
    .tk-deal { display: flex; align-items: center; gap: 9px; font-weight: 800;
      font-size: clamp(14px, 1.7vw, 22px); color: #fff; text-shadow: var(--tk-shadow); }
    .tk-deal .tk-amount { color: var(--tk-green); font-size: clamp(17px, 2.1vw, 28px);
      background: none; box-shadow: none; padding: 0; }

    /* ===================== Sponsor bug (CSAITECH) ===================== */
    .tk-brand {
      position: fixed; top: clamp(12px, 3vh, 26px); right: clamp(12px, 2.5vw, 30px); z-index: 8;
      display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
      padding: 7px 12px; border-radius: 12px;
      background: linear-gradient(180deg, rgba(20,28,52,.5), rgba(9,13,26,.62));
      border: 1px solid rgba(150,176,240,.20);
      box-shadow: 0 12px 32px -14px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.05);
      opacity: 0; visibility: hidden; transform: translateY(-6px);
      transition: opacity .45s ease, transform .45s ease; pointer-events: none;
    }
    .tk-brand.show { opacity: .94; visibility: visible; transform: translateY(0); }
    .tk-brand .tk-brand-k {
      font-size: clamp(7px, .68vw, 9px); letter-spacing: .22em; text-transform: uppercase;
      color: var(--tk-muted); font-weight: 800; text-shadow: var(--tk-tshadow);
    }
    .tk-brand img { height: clamp(14px, 1.6vw, 21px); width: auto; display: block;
      filter: drop-shadow(0 1px 5px rgba(0,0,0,.65)); }

    @media (max-width: 620px) {
      .tk-bar { grid-template-columns: 1fr; gap: 7px; }
      .tk-cell.left { align-items: center; }
      .tk-cell.center::before, .tk-cell.center::after { display: none; }
      .tk-cell.right { flex-direction: column; align-items: center; gap: 4px; }
      .tk-team { margin-left: 0; }
      .stat-panels { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tk-portrait-wrap::before, .tk-portrait-wrap::after, .tk-orbit,
      .tk-bar::after, .tk-topline, .tk-scan, .tk-live-dot, #tk-root.enter,
      .tk-next .tk-amount::before { animation: none; }
    }
  </style>
</head>
<body>
  <h2 class="sr-only">Live auction ticker showing the player on the block, the current bid, the leading team and career stats.</h2>

  <!-- Sponsor bug (CSAITECH) — top-right corner, appears with the ticker. -->
  <div class="tk-brand" id="tk-brand">
    <span class="tk-brand-k">Powered by</span>
    <img src="img/csaitech-logo.png" alt="CSAITECH">
  </div>

  <div id="tk-root">
    <div class="tk-live" id="tk-live"><span class="tk-live-dot"></span><span id="tk-live-text">On the block</span></div>

    <!-- Portrait floats above the centre column (broadcast lower-third look). -->
    <div class="tk-portrait-wrap">
      <span class="tk-orbit a"><i></i></span>
      <span class="tk-orbit b"><i></i></span>
      <div class="tk-portrait"><img id="tk-poster" alt="" style="display:none"><span id="tk-initials"></span></div>
      <span class="tk-serial" id="tk-serial" style="display:none"></span>   <!-- lot / SL number -->
    </div>

    <div class="tk-bar" id="tk-bar">
      <span class="tk-topline"></span>
      <span class="tk-scan"></span>

      <div class="tk-cell left">
        <div class="tk-base">
          <span class="tk-label">Base Price</span>
          <span class="tk-amount" id="tk-base">₹ —</span>
        </div>
      </div>

      <!-- centre column: reserves the space under the portrait for the name -->
      <div class="tk-cell center">
        <div class="tk-name" id="tk-name">Player</div>
        <div class="tk-meta">
          <span class="tk-role" id="tk-role"></span>
          <span class="tk-grp" id="tk-group" style="display:none"></span>
        </div>
      </div>

      <div class="tk-cell right">
        <div class="tk-current" id="tk-current-wrap">
          <span class="tk-label" id="tk-current-label">Current Bid</span>
          <div class="tk-cur-row">
            <span class="tk-trend" aria-hidden="true">▲</span>
            <span class="tk-amount" id="tk-current">₹ —</span>
          </div>
        </div>
        <!-- Leading team: big name + logo, occupying the old Next Bid space -->
        <div class="tk-team" id="tk-team">
          <span class="tk-team-name" id="tk-leadname"></span>
          <span class="tk-team-logo" id="tk-leadlogo"></span>
        </div>
      </div>

      <!-- SOLD / UNSOLD verdict, shown in place of the bid row after a sale -->
      <div class="tk-verdict" id="tk-verdict">
        <span class="tk-stamp" id="tk-stamp">SOLD</span>
        <div class="tk-deal" id="tk-deal"></div>
      </div>

      <!-- Career: batting / bowling panels (same format as the broadcast board) -->
      <div class="tk-stats" id="tk-stats"></div>
    </div>
  </div>

  <script src="tournament-context.js"></script>
  <script src="team-logo.js?v=2"></script>
  <script src="sold-fx.js?v=4"></script>
  <script src="ticker.js?v=7"></script>
</body>
</html>
